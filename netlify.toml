[build]
  command = "node scripts/build.mjs"
  publish = "dist"
  # No genera el sitio si el cambio es solo de documentos o pruebas (ver el archivo).
  ignore = "sh scripts/netlify-ignorar.sh"

[build.environment]
  NODE_VERSION = "22"

# CDN de imágenes de Netlify: permite convertir a JPG las fotos guardadas en Firebase Storage
# (los catálogos de Meta y de portales usan /.netlify/images?url=…&fm=jpg).
[images]
  remote_images = ["https://firebasestorage\\.googleapis\\.com/.*"]

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# URLs de la versión anterior del sitio
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301

[[redirects]]
  from = "/properties.html"
  to = "/propiedades/"
  status = 301

[[redirects]]
  from = "/property-single.html"
  to = "/propiedades/"
  status = 301

# Página de propietarios y colaboradores (antes el portal con enlace privado): lleva al panel y queda fuera de Google.
[[headers]]
  for = "/propietarios/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-cache"

[[headers]]
  for = "/en/owners/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-cache"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    # CSP mínima: nadie puede incrustar el sitio en otro dominio ni inyectar <base> u <object>.
    # No limita script-src: el sitio usa scripts en línea (gtag, JSON-LD) y Firebase desde gstatic.
    Content-Security-Policy = "frame-ancestors 'self'; base-uri 'self'; object-src 'none'; upgrade-insecure-requests"

# Va después de "/*": en Netlify, si dos reglas ponen el mismo encabezado, gana la de abajo.
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    # no-store: el navegador no guarda en disco las páginas del panel (ni la dirección con la que se abrieron).
    Cache-Control = "no-store"
    # CSP estricta del panel: solo corren los scripts del propio sitio y el SDK de Firebase (gstatic, por su ruta); nada
    # en línea (ni <script> ni onclick). Se conecta solo a Firebase (base, fotos, inicio de sesión y su renovación) y a
    # las dos revisiones que el panel pide de fuera (contraseñas filtradas y traducción). 'unsafe-eval' y worker blob:
    # los pide heic2any (fotos HEIC): sin ellos la conversión se queda esperando. Estilos en línea: el panel los pone
    # con h(…, { style }). img-src https: porque una imagen se puede pegar por su enlace. La prueba es
    # scripts/test-csp.mjs; el entorno de pruebas (scripts/entorno/servidor.mjs) la aplica igual que Netlify.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-eval' https://www.gstatic.com/firebasejs/; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://firestore.googleapis.com https://firebasestorage.googleapis.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://api.pwnedpasswords.com https://api.mymemory.translated.net; worker-src 'self' blob:; frame-src 'self'; form-action 'self'; frame-ancestors 'self'; base-uri 'self'; object-src 'none'; upgrade-insecure-requests"

# Archivos con hash en el nombre: nunca cambian, se guardan un año (mejora Core Web Vitals).
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Cache-Control = "public, max-age=3600"

# Catálogos para portales: se leen por enlace, no deben aparecer en Google.
[[headers]]
  for = "/feeds/*"
  [headers.values]
    X-Robots-Tag = "noindex"
    Cache-Control = "public, max-age=900"

[[headers]]
  for = "/llms.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"

[[headers]]
  for = "/llms-full.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
