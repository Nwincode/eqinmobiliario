[build]
  command = "node scripts/build.mjs"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# CDN de imágenes de Netlify: permite convertir a JPG las fotos guardadas en Firebase Storage
# (los catálogos de Meta y de portales usan /.netlify/images?url=…&fm=jpg).
[images]
  remote_images = ["https://firebasestorage\\.googleapis\\.com/.*"]

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# URLs de la versión anterior del sitio
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301

[[redirects]]
  from = "/properties.html"
  to = "/propiedades/"
  status = 301

[[redirects]]
  from = "/property-single.html"
  to = "/propiedades/"
  status = 301

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-cache"

# Página de propietarios y colaboradores (antes el portal con enlace privado): lleva al panel y queda fuera de Google.
[[headers]]
  for = "/propietarios/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-cache"

[[headers]]
  for = "/en/owners/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-cache"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    # CSP mínima: nadie puede incrustar el sitio en otro dominio ni inyectar <base> u <object>.
    # No limita script-src: el sitio usa scripts en línea (gtag, JSON-LD) y Firebase desde gstatic.
    Content-Security-Policy = "frame-ancestors 'self'; base-uri 'self'; object-src 'none'; upgrade-insecure-requests"

# Archivos con hash en el nombre: nunca cambian, se guardan un año (mejora Core Web Vitals).
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Cache-Control = "public, max-age=3600"

# Catálogos para portales: se leen por enlace, no deben aparecer en Google.
[[headers]]
  for = "/feeds/*"
  [headers.values]
    X-Robots-Tag = "noindex"
    Cache-Control = "public, max-age=900"

[[headers]]
  for = "/llms.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"

[[headers]]
  for = "/llms-full.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
