# Corre las pruebas en cada pull request y en cada cambio a main, en tres trabajos a la vez: sintaxis y lógica, reglas de
# Firestore y Storage (emuladores) y el recorrido de la reserva por noche (panel y sitio en un navegador, contra los
# emuladores). Todo con datos inventados: ningún trabajo usa secretos ni toca la base real.
# Las acciones van fijas por su commit (la versión, al lado): una etiqueta movida no cambia lo que corre aquí.
name: Pruebas
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  logica:
    name: Sintaxis y lógica
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      # Las pruebas cargan código del proyecto que usa sus dependencias (p. ej. la lectura de Google).
      - name: Dependencias
        run: npm ci
      - name: Sintaxis y lógica
        run: npm test

  reglas:
    name: Reglas de Firestore y Storage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 21
      # firebase-tools (versión fija) lo instala scripts/emulador/correr.sh.
      - name: Reglas (emuladores)
        run: npm run test:reglas

  recorrido:
    name: Recorrido de la reserva por noche
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 21
      # Playwright no está en package.json (solo lo usa el recorrido): misma versión que en local, sin cambiar el lockfile.
      - name: Dependencias y navegador
        run: |
          npm ci
          npm i --no-save --no-audit --no-fund playwright@1.63.0
          npx playwright install --with-deps chromium
      # Emuladores (inicio de sesión, base y fotos), datos inventados, el sitio generado y el servidor en el puerto 8090, todo en /tmp/eq-entorno.
      - name: Levantar el entorno
        run: npm run entorno
      - name: Recorrido
        run: npm run recorrido
      - name: Capturas y registros (si falló)
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: recorrido
          path: |
            /tmp/eq-entorno/capturas
            /tmp/eq-entorno/*.log
            /tmp/eq-entorno/correos.jsonl
          retention-days: 7
          if-no-files-found: ignore
